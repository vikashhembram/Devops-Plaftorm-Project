name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

# CI runs tests on PRs and publishes Docker images from main
permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Login to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get Docker Hub credentials from Key Vault
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          DOCKERHUB_USERNAME=$(az keyvault secret show \
            --vault-name kv-devops-platform-0 \
            --name dockerhub-username \
            --query value \
            --output tsv)

          DOCKERHUB_TOKEN=$(az keyvault secret show \
            --vault-name kv-devops-platform-0 \
            --name dockerhub-token \
            --query value \
            --output tsv)

          echo "::add-mask::$DOCKERHUB_USERNAME"
          echo "::add-mask::$DOCKERHUB_TOKEN"

          echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME" >> "$GITHUB_ENV"
          echo "DOCKERHUB_TOKEN=$DOCKERHUB_TOKEN" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t vikashhembram/devops-platform-app:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push vikashhembram/devops-platform-app:${{ github.sha }}